<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Por Tu Salud</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="hero">
      <div class="hero-card">
        <img
          class="hero-image"
          src="https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=80"
          alt="Por Tu Salud"
        />
        <h1>Por Tu Salud</h1>
        <p>Soy nutricionista y te ofrezco viandas saludables listas para consumir.</p>
        <div class="address">
          Deán Funes 455, Venado Tuerto, Santa Fe, Argentina · Tel: +54 9 3462 61-9313
        </div>

        <div class="hero-actions">
          <a class="btn" href="https://wa.me/5493462619313" target="_blank" rel="noopener noreferrer">WhatsApp</a>
          <a class="btn secondary" href="https://www.instagram.com/portusaludviandas" target="_blank" rel="noopener noreferrer">Instagram</a>
          <a class="btn location-btn" href="https://www.google.com/maps/search/?api=1&query=De%C3%A1n%20Funes%20455%2C%20Venado%20Tuerto%2C%20Santa%20Fe%2C%20Argentina" target="_blank" rel="noopener noreferrer">Ubicación</a>
        </div>
      </div>
    </section>

    <main class="container">
      <div class="role-bar">
        <label for="roleSelect">Rol</label>
        <select id="roleSelect">
          <option value="Visitante">Visitante</option>
          <option value="Propietario">Propietario</option>
        </select>
      </div>

      <div class="search-wrap">
        <div class="search-box">
          <span class="icon">🔎</span>
          <input id="searchInput" type="text" placeholder="Buscar viandas, ensaladas, postres..." />
        </div>
      </div>

      <div class="section-title">Categorías</div>
      <div class="divider"></div>
      <div id="categoryRow" class="category-row"></div>

      <div class="admin-actions">
        <button id="createCategoryBtn" class="btn secondary">Crear categoría</button>
        <button id="createPublicationBtn" class="btn">Crear publicación</button>
      </div>

      <div class="section-title">Publicaciones</div>
      <div class="divider"></div>
      <div id="products" class="products-grid"></div>
    </main>

    <div id="modal" class="modal" aria-hidden="true">
      <div class="modal-card" id="modalCard">
        <div class="modal-header">
          <span class="modal-drag-handle" aria-label="Mover ventana">⋮⋮</span>
          <h3 id="modalTitle"></h3>
        </div>
        <div id="modalBody"></div>
        <div id="modalActions" class="modal-actions"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
